[project]
name = "cnn-accelerator"
version = "0.0.0"
description = "Verified int8 CNN inference accelerator in SystemVerilog"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["testbench"]
# Makes testbench/common importable both by pytest and, via PYTHONPATH,
# by the cocotb test modules running inside the simulator.
pythonpath = ["testbench"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["third_party", "sim_build"]
# Lets the import sorter treat testbench/common and model/ as first-party.
src = [".", "testbench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
