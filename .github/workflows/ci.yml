name: CI

# Fast checks on every push and pull request, as four parallel jobs so the workflow finishes in
# well under 10 minutes: ruff, RTL lint and the script and golden-model tests; the Icarus unit
# tests; the other unit tests (Verilator, SVA-fires, synthesis checks); and the quick-subset
# system tests (pytest -m "not full"). The slow tests (marked `full`), the formal proofs and the
# rest run in full.yml (nightly and on manual trigger); checkpoints require full.yml green for
# HEAD.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: lint
            name: lint, scripts, model
          - part: unit-icarus
            name: unit, Icarus
          - part: unit-other
            name: unit, Verilator
          - part: system
            name: quick-subset system tests
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Ruff
        if: matrix.part == 'lint'
        run: |
          ruff format --check .
          ruff check .

      - name: RTL lint (Verilator -Wall, Icarus, Yosys)
        if: matrix.part == 'lint'
        run: scripts/lint.sh

      - name: Script and golden model tests
        if: always() && matrix.part == 'lint'
        run: |
          source scripts/env.sh
          pytest scripts/tests model/tests --junitxml=sim_build/results.xml

      - name: Unit tests on Icarus
        if: matrix.part == 'unit-icarus'
        run: |
          source scripts/env.sh
          pytest testbench/unit -k icarus --junitxml=sim_build/results.xml

      - name: Unit tests on Verilator, SVA-fires and synthesis checks (every unit test not on Icarus)
        if: matrix.part == 'unit-other'
        run: |
          source scripts/env.sh
          pytest testbench/unit -k "not icarus" --junitxml=sim_build/results.xml

      - name: Quick-subset system tests (accel_top, accelerator AXI slave, SoC firmware; Verilator)
        if: matrix.part == 'system'
        run: |
          source scripts/env.sh
          pytest testbench/system -m "not full" --junitxml=sim_build/results.xml

      - name: Check the results file
        if: always()
        env:
          MIN_TESTS: ${{ matrix.part == 'lint' && 30 || matrix.part == 'system' && 10 || 30 }}
        run: python scripts/check_junit.py sim_build/results.xml --min-tests "$MIN_TESTS"

      - name: Upload simulation results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-results-${{ matrix.part }}
          path: |
            sim_build/**/*.xml
            sim_build/**/*.fst
          if-no-files-found: ignore
