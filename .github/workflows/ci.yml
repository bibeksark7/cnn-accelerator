name: CI

# Fast job on every push and pull request: ruff, RTL lint, every unit test, and the quick-subset
# system tests (pytest -m "not full"). The slow tests (marked `full`), the formal proofs and the
# rest run in full.yml (nightly and on manual trigger); checkpoints require full.yml green for
# HEAD.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (lint, unit, quick subset)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: RTL lint (Verilator -Wall, Icarus, Yosys)
        run: scripts/lint.sh

      - name: Unit tests (Icarus + Verilator)
        if: always()
        run: |
          source scripts/env.sh
          pytest testbench/unit --junitxml=sim_build/unit.xml

      - name: Check unit test results file
        if: always()
        run: python scripts/check_junit.py sim_build/unit.xml --min-tests 80

      - name: Quick-subset system tests (accel_top, accelerator AXI slave, SoC firmware; Verilator)
        if: always()
        run: |
          source scripts/env.sh
          pytest testbench/system -m "not full" --junitxml=sim_build/system.xml

      - name: Check system test results file
        if: always()
        run: python scripts/check_junit.py sim_build/system.xml --min-tests 10

      - name: Script and golden model tests
        if: always()
        run: |
          source scripts/env.sh
          pytest scripts/tests model/tests --junitxml=sim_build/scripts_model.xml

      - name: Check script and golden model results file
        if: always()
        run: python scripts/check_junit.py sim_build/scripts_model.xml --min-tests 30

      - name: Upload simulation results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-results
          path: |
            sim_build/**/*.xml
            sim_build/**/*.fst
          if-no-files-found: ignore
